# Rebuilds guide.json every 6 hours and publishes it on the "guide" branch, where the Live TV apps
# download it from:
#   https://raw.githubusercontent.com/<owner>/<repo>/guide/guide.json
# The branch holds a single commit that's replaced each time, so the repository doesn't grow.
name: Guide

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build guide.json
        run: python3 tools/build_guide.py --out guide.json
      - name: Publish to the guide branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          mv guide.json publish/
          cd publish
          git init -q -b guide
          git add guide.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Guide $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" guide
